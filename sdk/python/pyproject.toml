[project]
name = "mang-rpc"
version = "0.1.0"
description = "mang-shell RPC Python 客户端——27 命令全覆盖 + doc_changed 事件流（同步/异步、自动重连、类型完整）"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "mdcore contributors" }]
keywords = ["mang-shell", "mdcore", "editor", "rpc", "ai"]
# 运行时零第三方依赖——纯标准库（socket / json / dataclasses / typing）。
dependencies = []

# 开发工具放 dependency-groups（PEP 735）而非 optional-dependencies（extras）：
# 裸 `uv sync` 默认装 dev 组——`uv run pytest` 不会静默回退到 PATH 上的系统
# pytest（那会缺本包的 editable 安装，报 ModuleNotFoundError 误导排障）。
# 与 sdk/mcp 一致；运行时依赖仍为空。
[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "black>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mang_rpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W 基础 + I 排序 + UP 现代化 + B 常见坑 + SIM 简化。
# E501 交给 black（字符串/中文注释不受 black 换行保护，长度由人工控制）。
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
