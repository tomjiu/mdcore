[package]
name = "gpui_platform"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# [lints] 移植时删除：第三方代码不受项目 lint 门（Zed workspace lints）
[lib]
path = "src/gpui_platform.rs"
doctest = false

[features]
default = ["multithreaded"]
# Threads in the browser: needs a nightly toolchain and a cross-origin-isolated
# page. Off, gpui_web builds on stable.
multithreaded = ["gpui_web/multithreaded"]
bench-support = ["gpui/bench-support", "gpui_macos/bench-support", "gpui_wgpu/bench-support"]
font-kit = ["gpui_macos/font-kit"]
inspector = ["gpui/inspector"]
test-support = ["gpui/test-support", "gpui_macos/test-support", "gpui_windows/test-support", "gpui_wgpu/test-support"]
screen-capture = ["gpui/screen-capture", "gpui_macos/screen-capture", "gpui_windows/screen-capture", "gpui_linux/screen-capture"]
runtime_shaders = ["gpui_macos/runtime_shaders", "gpui_ios/runtime_shaders"]
wayland = ["gpui_linux/wayland"]
x11 = ["gpui_linux/x11"]

# [[bench]]/[[example]]/[[test]] 段移植时删除：对应目录不在搬运面
# [[bench]]/[[example]]/[[test]] 段移植时删除：对应目录不在搬运面
# [[bench]]/[[example]]/[[test]] 段移植时删除：对应目录不在搬运面
# [[bench]]/[[example]]/[[test]] 段移植时删除：对应目录不在搬运面
[dependencies]
anyhow = "1.0.86"
gpui = { path = "../gpui", default-features = false }

[dev-dependencies]
bench_metrics = { path = "../bench_metrics" }
criterion = { version = "0.8.2", features = ["html_reports"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { path = "../gpui_macos", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
gpui_ios = { path = "../gpui_ios" }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { path = "../gpui_windows", default-features = false }
gpui = { path = "../gpui", default-features = false, features = ["windows-manifest"] }

[target.'cfg(all(any(target_os = "linux", target_os = "freebsd"), not(target_env = "ohos")))'.dependencies]
gpui_linux = { path = "../gpui_linux", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_wgpu = { path = "../gpui_wgpu", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web = { path = "../gpui_web", default-features = false }
console_error_panic_hook = "0.1.7"
