[package]
name = "ui"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# [lints] 移植时删除：第三方代码不受项目 lint 门（Zed workspace lints）
[lib]
name = "ui"
path = "src/ui.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
component = { path = "../component" }
documented = "0.10"
gpui = { path = "../gpui", default-features = false }
gpui_macros = { path = "../gpui_macros" }
icons = { path = "../icons" }
itertools = "0.14.0"
log = { version = "0.4", default-features = false, features = ["std"] }
menu = { path = "../menu" }
schemars = { version = "1.0", default-features = false, features = ["std", "indexmap2"] }
serde = { version = "1.0", features = ["rc"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }
strum = { version = "0.28", features = ["derive"] }
theme = { path = "../theme" }
ui_macros = { path = "../ui_macros" }
web-time = "1.1.0"
gpui_util = { path = "../gpui_util" }

[dev-dependencies]
gpui = { path = "../gpui", default-features = false, features = ["test-support"] }
# [port] dev-dep settings 在闭包外，删除
# [port] dev-dep theme_settings 在闭包外，删除

[package.metadata.cargo-shear]
ignored = ["log"]

[features]
default = []
