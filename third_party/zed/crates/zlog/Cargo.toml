[package]
name = "zlog"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# [lints] 移植时删除：第三方代码不受项目 lint 门（Zed workspace lints）
[lib]
path = "src/zlog.rs"
doctest = false

[features]
default = []

[dependencies]
collections = { path = "../collections", version = "0.1.0" }
chrono = { version = "0.4", default-features = true, features = ["std", "serde"] }
log = { version = "0.4", default-features = false, features = ["std", "kv_unstable_std"] }
anyhow = "1.0.86"

[dev-dependencies]
tempfile = "3.20.0"
