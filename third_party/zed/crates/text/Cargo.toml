[package]
name = "text"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# [lints] 移植时删除：第三方代码不受项目 lint 门（Zed workspace lints）
[lib]
path = "src/text.rs"
doctest = false

[features]
test-support = ["rand"]

[dependencies]
anyhow = "1.0.86"
clock = { path = "../clock" }
collections = { path = "../collections", version = "0.1.0" }
gpui_util = { path = "../gpui_util" }
log = { version = "0.4", default-features = false, features = ["std"] }
parking_lot = "0.12.1"
postage = { version = "0.5", default-features = false }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"], optional = true }
regex = { version = "1.5", default-features = false, features = ["std", "perf"] }
rope = { path = "../rope" }
smallvec = { version = "1.6", features = ["union", "const_new"] }
sum_tree = { path = "../sum_tree" }
# [port] optional prod-dep util 在闭包外（feature-gated，未激活），删除

[dev-dependencies]
collections = { path = "../collections", version = "0.1.0", features = ["test-support"] }
ctor = "1.0.12"
gpui = { path = "../gpui", default-features = false, features = ["test-support"] }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
# [port] dev-dep util 在闭包外，删除
zlog = { path = "../zlog" }
