[package]
name = "theme"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# [lints] 移植时删除：第三方代码不受项目 lint 门（Zed workspace lints）
[features]
default = []
test-support = ["gpui/test-support", "syntax_theme/test-support"]

[lib]
path = "src/theme.rs"
doctest = false

[dependencies]
anyhow = "1.0.86"
collections = { path = "../collections", version = "0.1.0" }
gpui = { path = "../gpui", default-features = false }
syntax_theme = { path = "../syntax_theme" }
palette = { version = "0.7.5", default-features = false, features = ["std"] }
parking_lot = "0.12.1"
refineable = { path = "../refineable" }
schemars = { version = "1.0", default-features = false, features = ["std", "indexmap2"] }
serde = { version = "1.0", features = ["rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
serde_json_lenient = { version = "0.2", features = [ "preserve_order", "raw_value", ] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0.12"
uuid = { version = "1.1", features = ["serde"] }

[dev-dependencies]
gpui = { path = "../gpui", default-features = false, features = ["test-support"] }
