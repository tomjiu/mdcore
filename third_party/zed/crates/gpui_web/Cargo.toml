[package]
name = "gpui_web"
version = "0.1.0"
publish = false
edition = "2024"
license = "Apache-2.0"
autoexamples = false

# [lints] 移植时删除：第三方代码不受项目 lint 门（Zed workspace lints）
[features]
default = ["multithreaded"]
multithreaded = ["dep:wasm_thread", "scheduler/wasm-threads"]

[lib]
path = "src/gpui_web.rs"
doctest = false

[dependencies]
unicode-properties = "=0.1.3"
unicode-script = "0.5.7"
unicode-segmentation = "1.10"

[target.'cfg(target_family = "wasm")'.dependencies]
gpui = { path = "../gpui", default-features = false }
scheduler = { path = "../scheduler" }
parking_lot = { version = "0.12.1", features = ["nightly"] }
gpui_wgpu = { path = "../gpui_wgpu" }
http_client = { path = "../http_client" }
anyhow = "1.0.86"
async-channel = { version = "2.5", default-features = false }
futures = "0.3.34"
log = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1.1", features = ["serde"] }
wasm-bindgen = "0.2.120"
wasm-bindgen-futures = "0.4"
web-time = "1.1.0"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
raw-window-handle = "0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937", version = "0.3", features = ["es_modules"], optional = true }
web-sys = { version = "0.3", features = [
    "console",
    "Blob",
    "Clipboard",
    "ClipboardEvent",
    "ClipboardItem",
    "CompositionEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "EventTarget",
    "File",
    "FocusOptions",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlTextAreaElement",
    "IdleDeadline",
    "IdleRequestOptions",
    "ImageData",
    "InputEvent",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MouseEvent",
    "Navigator",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "PointerEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "ResizeObserver",
    "ResizeObserverBoxOptions",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "ResizeObserverOptions",
    "Screen",
    "Storage",
    "TextMetrics",
    "VisualViewport",
    "Headers",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "RequestRedirect",
    "Response",
    "WheelEvent",
    "Window",
] }

[dev-dependencies]
anyhow = "1.0.86"
gpui = { path = "../gpui", default-features = false }
smallvec = { version = "1.6", features = ["union", "const_new"] }

[package.metadata.cargo-shear]
ignored = ["scheduler"]
