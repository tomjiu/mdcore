[package]
name = "gpui_ios"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# [lints] 移植时删除：第三方代码不受项目 lint 门（Zed workspace lints）
[lib]
path = "src/gpui_ios.rs"
crate-type = ["staticlib", "rlib"]
doctest = false

# [[bench]]/[[example]]/[[test]] 段移植时删除：对应目录不在搬运面
# [[bench]]/[[example]]/[[test]] 段移植时删除：对应目录不在搬运面
[features]
runtime_shaders = ["gpui_apple/runtime_shaders"]

[dependencies]
gpui = { path = "../gpui", default-features = false }

[target.'cfg(target_os = "ios")'.dev-dependencies]
gpui_platform = { path = "../gpui_platform", default-features = false }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-quartz-core", "objc2-core-foundation", "NSText", "UIApplication", "UICommand", "UICornerConfiguration", "UICornerRadius", "UIEvent", "UIGeometry", "UIGestureRecognizer", "UIPanGestureRecognizer", "UIScreenEdgePanGestureRecognizer", "UIInterface", "UIOpenURLContext", "UIPasteboard", "UIResponder", "UIScene", "UISceneConfiguration", "UISceneDefinitions", "UISceneOptions", "UISceneSession", "UIScreen", "UITextInput", "UITextInputTraits", "UITouch", "UITraitCollection", "UIView", "UIViewController", "UIWindow", "UIWindowScene", "UIConversationContext"] }
slotmap = "1.0.6"

[target.'cfg(target_os = "ios")'.dependencies]
anyhow = "1.0.86"
block2 = "0.6"
futures = "0.3.34"
gpui_apple = { path = "../gpui_apple", features = ["font-kit"] }
log = { version = "0.4", default-features = false, features = ["std"] }
objc2 = "0.6"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSAttributedString", "NSBundle", "NSCoder", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSNull", "NSObjCRuntime", "NSObject", "NSProcessInfo", "NSRange", "NSRunLoop", "NSSet", "NSString", "NSURL", "NSValue", "objc2-core-foundation", "std", "NSThread", "NSOperation", "NSUserActivity", "block2"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [ "std", "block2", "objc2-quartz-core", "objc2-core-foundation", "NSText", "UIApplication", "UICommand", "UICornerConfiguration", "UICornerRadius", "UIEvent", "UIGeometry", "UIGestureRecognizer", "UIPanGestureRecognizer", "UIScreenEdgePanGestureRecognizer", "UIInterface", "UIOpenURLContext", "UIPasteboard", "UIResponder", "UIScene", "UISceneConfiguration", "UISceneDefinitions", "UISceneOptions", "UISceneSession", "UIScreen", "UITextInput", "UITextInputTraits", "UITouch", "UITraitCollection", "UIView", "UIViewController", "UIWindow", "UIWindowScene", ] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CADisplayLink"] }
objc2-core-foundation = { version = "=0.3.2", default-features = true }
parking_lot = "0.12.1"
raw-window-handle = "0.6"
uuid = { version = "1.1", features = ["serde", "v5"] }
