[package]
name = "component"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# [lints] 移植时删除：第三方代码不受项目 lint 门（Zed workspace lints）
[lib]
path = "src/component.rs"
test = false

[dependencies]
collections = { path = "../collections", version = "0.1.0" }
gpui = { path = "../gpui", default-features = false }
inventory = "0.3.19"
parking_lot = "0.12.1"
strum = { version = "0.28", features = ["derive"] }
theme = { path = "../theme" }

[dev-dependencies]
documented = "0.10"

[features]
default = []
