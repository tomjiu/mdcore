[package]
name = "syntax_theme"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# [lints] 移植时删除：第三方代码不受项目 lint 门（Zed workspace lints）
[features]
default = []
test-support = ["gpui/test-support"]
bundled-themes = ["dep:serde", "dep:serde_json"]

[lib]
path = "src/syntax_theme.rs"
doctest = false

[dependencies]
gpui = { path = "../gpui", default-features = false }
serde = { version = "1.0", features = ["rc"], optional = true }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"], optional = true }

[dev-dependencies]
gpui = { path = "../gpui", default-features = false, features = ["test-support"] }
