[workspace]
resolver = "2"
members = ["crates/mdcore", "crates/mdcore-wasm", "crates/formula", "crates/pdf-wasm", "crates/shell", "crates/shell-native", "crates/pdf", "crates/settings", "crates/office", "crates/office-io", "crates/evidence", "crates/workbench", "crates/collab", "crates/canvas", "crates/mdbridge", "crates/relay", "crates/overlay", "crates/overlay-pdf", "crates/lok"]
default-members = ["crates/mdcore", "crates/shell", "crates/shell-native", "crates/pdf", "crates/settings", "crates/office", "crates/office-io", "crates/evidence", "crates/workbench", "crates/collab", "crates/canvas", "crates/mdbridge", "crates/relay", "crates/overlay", "crates/overlay-pdf", "crates/lok"]

# R24-c 版本单源：全部 crate 经 version.workspace 继承此值（禁止
# crate 内独立声明版本——r24_packaging.rs 跨 crate 一致性锁背书）。
# 发布产物（deb control / NSIS / Info.plist / AppImage）由打包脚本
# 从 mdcore::VERSION（= CARGO_PKG_VERSION，同一源）注入，见 packaging/。
[workspace.package]
version = "0.1.0"

# T1 依赖卫生（fix-c）：serde/serde_json 版本要求单源化——各 crate 以
# `workspace = true` 继承本表（禁止 crate 内独立写版本号）；取值与
# Cargo.lock 现解析精确一致（serde 1.0.229 / serde_json 1.0.151），
# 收紧零锁变化。feature 声明（derive/rc 等）是 crate 本地面，随各
# crate 清单写 `features = [...]`；引擎 pin（pdfium-render/lopdf 的
# optional 面）保持各 crate 现状——PDF-c/d 决策记录见 gates.md。
[workspace.dependencies]
serde = "1.0.229"
serde_json = "1.0.151"

# R8 Headless Core v0 — 依赖策略（主档 §9 / tech-stack）:
#   ropey      = 文本存储实现（指定的技术栈成员）
#   serde      = JSON 序列化（op 流 / snapshot / history 的最低成本选择）
#   wasm-bindgen = 仅 mdcore-wasm 使用（宿主绑定层）
# 其余零依赖：无运行时、无框架。Core 语义不依赖任何一项——serde 仅出现在
# 序列化边界，tree/op 本身可脱离 serde 编译（见 lib.rs feature 说明）。
#
# R10 增补：crates/shell = 宿主契约层（headless 可验证，零 GUI 依赖）；
# crates/shell-native = tao+wry+GTK3 胶水蓝图（ADR-H1；随附零依赖可编译/可测试，
# 原生依赖启用后需 webkit2gtk-4.1 系统库——见该 crate 文档）。
#
# office-impl T1 增补：crates/office（mdc-office）= Office 域引擎侧基础
# 设施（第一模块 sanitize = 敌意输出面消毒五面）。纯 std 零三方依赖，
# 对 mdcore 零编译依赖（三域纪律，2026-10-12 用户裁决：MD/PDF/Office
# 独立领域模型与引擎）——循 mdc-pdf 并列引擎先例，规格依据 = 分析仓
# office-d §5 一手代码级裁决。
#
# xlsx-r1 阶段 B 增补（2026-10-13）：crates/office-io（mdc-office-io）
# = XLSX 读路径引擎（容器预扫双门 + calamine 包装 + 统一错误三分）。
# 双 crate 方案 A：IO 三方依赖（calamine/zip，按分析仓 xlsx-r1/
# DEPS.md 锁版本）承载于此，mdc-office 保持零三方依赖自锁不变量；
# 对 mdcore 零编译依赖（三域纪律延续）。
#
# PDF-b 增补：crates/pdf（mdc-pdf）= 第二 Document Model 骨架（页/大纲/
# 标注 + Command 边界 + 安全策略 + 协议草案；与 mdcore 零 path 依赖，
# 零引擎依赖——pdfium/lopdf 自 PDF-c/d 引入）。
