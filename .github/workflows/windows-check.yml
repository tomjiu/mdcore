name: windows-check

# 目标：把 #[cfg(not(unix))] / #[cfg(windows)] 分支纳入编译覆盖。
# 由来：bid-parse guidance E0596 与本地 guard.rs 回归都是因为 Windows 分支从未编译。
# 范围纪律：只做 cargo check（不做完整 test），保证分钟数可控且能抓到编译级回归。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 依赖下载重试：Windows runner 偶发网络抖动
  CARGO_NET_RETRY: 3

jobs:
  check:
    name: windows / cargo check
    # self-hosted runner: GitHub Free 私有仓库无 Actions 配额，用本机 runner 替代
    # 标签来自 runner 注册时的默认集：self-hosted, Windows, X64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: fmt gate (main workspace)
        # #341：fmt 纪律前置到 CI（此前零 fmt 步骤，纯靠代理自觉，main 曾漂移
        # 1291 行/23 文件）。工具链由 rust-toolchain.toml 钉 1.99.0——rustfmt
        # 同版（1.10.0）跨环境可复现（rustup 按 toolchain 文件自动补装
        # components 里声明的 rustfmt）；升级工具链 = 显式改该文件并全仓复跑。
        run: |
          cargo fmt --version
          cargo fmt --all -- --check

      - name: fmt gate (mang-shell independent workspace)
        # #341：mang-shell 自带独立 [workspace] 表——主 workspace 的 --all
        # 不触达该目录，需第二遍在子目录跑（修复建议原文）。
        working-directory: mang-shell
        run: |
          cargo fmt --version
          cargo fmt --all -- --check

      - name: cargo check (workspace, excluding GTK-only shell)
        # mdshell-native 依赖 GTK3/WebKitGTK，Windows 上无实体 -> 排除。
        # 其余全部 crate 必须能编译：这是 Windows 平台的编译契约。
        run: cargo check --workspace --all-targets --exclude mdshell-native

      - name: cargo check wasm target
        run: cargo check -p mdcore-wasm --target wasm32-unknown-unknown

      - name: Report excluded crate
        if: always()
        run: |
          echo '### Windows CI 覆盖范围' >> $env:GITHUB_STEP_SUMMARY
          echo '' >> $env:GITHUB_STEP_SUMMARY
          echo '| 项 | 状态 |' >> $env:GITHUB_STEP_SUMMARY
          echo '|---|---|' >> $env:GITHUB_STEP_SUMMARY
          echo '| 引擎核心 crate | 编译覆盖 |' >> $env:GITHUB_STEP_SUMMARY
          echo '| wasm target | 编译覆盖 |' >> $env:GITHUB_STEP_SUMMARY
          echo '| mdshell-native (GTK) | **不覆盖**（Windows 无 GTK 依赖实体） |' >> $env:GITHUB_STEP_SUMMARY
