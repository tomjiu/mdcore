[package]
name = "mdc-office"
version.workspace = true
edition = "2021"
description = "Office 域引擎侧基础设施（office-impl T1 + xlsx-r1 阶段 B）：第一模块 sanitize = 敌意输出面消毒六面（CSV 公式首字符 / XML 控制字符保字符档 / XML 实体属性位兜底 / HTML 出口转义 / 域指令白名单 / URL scheme 白名单），规格 = 分析仓 office-d §5 一手代码级裁决 + xlsx-r1 t10-e §6 补面。零三方依赖纯 std；对 mdcore 零编译依赖（三域纪律，循 mdc-pdf 并列引擎先例）。XLSX IO 三方依赖在姊妹 crate mdc-office-io（双 crate 方案 A）。"
