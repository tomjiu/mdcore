[package]
name = "mdshell-native"
version.workspace = true
edition = "2021"
description = "R10 原生宿主壳（tao + wry + GTK3，ADR-H1 定谳：Slint 因 GPL 证排除）。s5a-env 轮起依赖已实体化：编译需 webkit2gtk-4.1/GTK3 dev 面——本沙箱以 apt download + dpkg -x 提取树自愈（source /home/z/my-project/optroot/env.sh 后再 cargo check -p mdshell-native）。"

# 依赖（s5a-env 实体化，版本循 Cargo.toml 注释蓝图原值）：
# ADR-H1：tao+wry+GTK3，无 Slint。
[dependencies]
mdcore = { path = "../mdcore" }
mdshell = { path = "../shell" }

# 平台门（issue #4）：GUI 面 = Linux-only（ADR-H1 GTK3/WebKitGTK 栈
# 架构定谳）。wry/tao/gtk 的 sys 底座（gobject-sys/glib-sys/
# webkit2gtk-sys）在无 GTK 环境与交叉目标下必然构建失败——
# 「保编译」面用 cfg 门实现：非 Linux = 无依赖空壳（cargo check
# --workspace --target x86_64-pc-windows-msvc 全绿的可验证形态）。
[target.'cfg(target_os = "linux")'.dependencies]
wry = "0.46"
tao = "0.30"
gtk = "0.18"   # GTK3 绑定（Linux 面板控件；Slint 因 GPL 证与 ADR-C1 排除）
