[package]
name = "mdshell"
version.workspace = true
edition = "2021"
description = "R10 宿主契约层：文档生命周期（open/progressive-open/save/document_id）的 headless 可验证实现。原生 WebView 后端见 shell-native（蓝图态随 workspace 编译，实体编译待原生环境）。"

[dependencies]
mdcore = { path = "../mdcore" }
mdc-settings = { path = "../settings" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
