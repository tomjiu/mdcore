[package]
name = "mdshell"
version.workspace = true
edition = "2021"
description = "R10 宿主契约层：文档生命周期（open/progressive-open/save/document_id）的 headless 可验证实现。原生壳主线为 mang-shell（GPUI 自绘）；旧 GTK 后端 shell-native 已剪裁移除。"

[dependencies]
mdcore = { path = "../mdcore" }
mdc-settings = { path = "../settings" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
