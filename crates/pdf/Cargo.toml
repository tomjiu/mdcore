[package]
name = "mdc-pdf"
version.workspace = true
edition = "2021"
description = "第二 Document Model（PDF 面）：页/大纲/标注三层模型 + Command 边界 + 安全策略 + 宿主协议草案 + PDF-c 阅读面（pdfium 引擎/LRU 页缓存/渲染工人/文本层）+ PDF-d 标注面（lopdf 增量写）；与 mdcore 块核并列互不依赖。"

# PDF-c/d 引擎依赖纪律（决策记录见 gates.md PDF-c/PDF-d 节）：
# - 默认构建零引擎依赖不变（default = []——跨环境可构建纪律，PDF-b 延续）：
#   `cargo test --workspace` 在无 pdfium 二进制的环境保持全绿。
# - `engine-pdfium` 特性引入 pdfium-render =0.9.4（版本 pin，ADR-P1）：
#   default-features = false——**零 image 依赖**（渲染走 PdfBitmap::from_bytes
#   调用方缓冲低层路径，不走 as_image/image crate）；pdfium_latest =
#   pdfium_7881 绑定面（chromium/8086 二进制向后兼容）；thread_safe =
#   FFI 全局互斥串行化（pdfium 单线程库的进程级兜底——分线程纪律见
#   engine_pdfium.rs 模块文档）。
# - `engine-lopdf` 特性引入 lopdf =0.45.0（版本 pin，PDF-d 标注增量写）：
#   default-features = false——默认特性 chrono-clock / rayon 全关；解析必需
#   依赖（nom / flate2 / md-5 等）为 lopdf 非可选面随包引入；image 系
#   （embed_image）保持关闭——与 pdfium-render 面同一零 image 纪律。
# - sha2 0.11（#308 签名摘要一致性）：**零新增编译单元**——lopdf 0.45
#   自身已依赖 sha2 ^0.11（见 Cargo.lock），这里只是把它声明为直接依赖
#   供 signature.rs 计算 ByteRange 覆盖段摘要。caret 语义（非精确 pin）：
#   mang-shell 嵌套 workspace 的锁文件把 lopdf 面解析到 0.11.1，精确
#   pin =0.11.0 会与之冲突（PR #310 CI 事故：两个锁文件各持 0.11.0/
#   0.11.1 时 cargo 拒绝选择）。仅随 engine-lopdf 启用（signature 门）。
[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
pdfium-render = { version = "=0.9.4", optional = true, default-features = false, features = [
    "pdfium_latest",
    "thread_safe",
] }
lopdf = { version = "=0.45.0", optional = true, default-features = false }
sha2 = { version = "0.11.0", optional = true, default-features = false }

[features]
default = []
# pdfium 引擎实装（engine_pdfium 模块 + 引擎测试面）。库定位序与绑定
# 纪律见 engine_pdfium.rs；测试环境需 libpdfium.so 在位（env
# MDC_PDFIUM_LIB / 编译期候选清单含 spike 取件位 / 系统）。
engine-pdfium = ["dep:pdfium-render"]
# lopdf 标注增量写实装（writer_lopdf 模块 + 标注面测试面）。增量语义
# （原字节前缀逐位保持）与标准 Annot 对象纪律见 writer_lopdf.rs；
# 测试环境需 fixtures（spike 取件位，同 engine-pdfium 面）。sha2 随本门
# 启用（signature.rs 摘要一致性，#308——依赖树已在，零编译单元增量）。
engine-lopdf = ["dep:lopdf", "dep:sha2"]

# #469:q31 消费 engine-lopdf 门后 API(generate)——裸 crate 调用
# (cargo check -p mdc-pdf --all-targets)曾 E0432 基线红(pdf-organize §6
# 登记)。required-features 门后:默认特性构建跳过本 example,特性开启
# (CI 同款)照常在场——零行为变化,只补调用面纪律。
[[example]]
name = "q31_acceptance"
required-features = ["engine-lopdf"]
